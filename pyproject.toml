[project]
name = "modern-yolonas"
dynamic = ["version"]
description = "Modern YOLO-NAS object detection — clean reimplementation"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Luis Condados"}, {name = "Alan Neves"}]
requires-python = ">=3.10"
keywords = [
    "object-detection",
    "yolo",
    "yolo-nas",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "onnx",
    "openvino",
    "edge-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
    "torch>=2.7",
    "torchvision>=0.22",
    "pycocotools>=2.0",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
    "torchmetrics>=1.3",
    "albumentations==1.4.24",
    "supervision>=0.30",
    "lightning>=2.4",
]

[project.urls]
Homepage = "https://github.com/CondadosAI/modern-yolonas"
Documentation = "https://condadosai.github.io/modern-yolonas/"
Repository = "https://github.com/CondadosAI/modern-yolonas"
Changelog = "https://github.com/CondadosAI/modern-yolonas/blob/main/CHANGELOG.md"
Issues = "https://github.com/CondadosAI/modern-yolonas/issues"
Funding = "https://github.com/sponsors/Gabriellgpc"

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn>=0.20", "python-multipart>=0.0.6"]
demo = ["gradio>=4.0"]
onnx = ["onnx>=1.14", "onnxruntime>=1.15", "onnxscript>=0.6.0"]
benchmark = ["rf100vl>=0.1"]
fiftyone = ["fiftyone>=1.0"]
openvino = ["openvino>=2024.0"]
wandb = ["wandb>=0.16"]
tensorboard = ["tensorboard>=2.15"]

[project.scripts]
yolonas = "modern_yolonas.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/modern_yolonas/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_yolonas"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require model weights or heavy computation",
]

[tool.coverage.run]
source = ["modern_yolonas"]
omit = [
    "src/modern_yolonas/_version.py",
    # IO / network wrappers — covering these needs integration tests with mocks.
    "src/modern_yolonas/hub.py",
    "src/modern_yolonas/serve/app.py",
    "src/modern_yolonas/export/frigate.py",
    "src/modern_yolonas/data/download.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.15.0",
    "mypy>=1.0",
    "pre-commit",
    # Fetching the Roboflow datasets the tutorials fine-tune on, and running
    # the notebooks that do it.
    "roboflow>=1.2.13",
    "jupyter>=1.1.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]
