name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Sections match the Conventional Commits type in the pull request title, which
# `pr-title.yml` enforces. The label predicates are kept as a second condition —
# conditions in a `when` list are OR'd — so anything labelled by hand still lands
# in the right section even if its title says something else.
categories:
  - title: "New Features"
    when:
      - conventional:
          types: ["feat"]
      - labels: ["enhancement", "feature"]
  - title: "Bug Fixes"
    when:
      - conventional:
          types: ["fix"]
      - labels: ["bug", "fix"]
  - title: "Documentation"
    when:
      - conventional:
          types: ["docs"]
      - labels: ["docs", "documentation"]
  - title: "Maintenance"
    when:
      - conventional:
          types: ["chore", "ci", "build", "refactor", "perf", "test", "style", "revert"]
      - labels: ["chore", "maintenance", "dependencies"]

  # --- Version resolution, read straight from the title ---
  #
  # This used to go through labels: the autolabeler turned the title into a
  # `minor`/`patch` label and the resolver read the label back. `conventional`
  # matches the title directly, so that round-trip is gone.
  #
  # While the package is 0.x there is no stability contract, so a breaking change
  # takes the minor slot — see SemVer 4. At 1.0.0, change the increment below to
  # "major".
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      - conventional:
          breaking: true
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      - conventional:
          types: ["feat"]

  # Manual override. The highest matching increment wins, so a label can raise a
  # bump but never lower one. This is how the `dev` -> `main` release pull request
  # gets its version: its title is `chore: ...`, which the rules above resolve to a
  # patch, so a release carrying features needs the label.
  #
  # The labels are namespaced because Dependabot applies a bare `major`, `minor` or
  # `patch` label to its own pull requests whenever the repository has one, to say
  # how far a *dependency* moved. The resolver reads every pull request merged since
  # the last release, so a grouped bump containing one major dependency update
  # drafted v0.6.0 as v1.0.0.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "release:major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "release:minor"

  # Everything else: patch. No `when`, so it matches unconditionally.
  - type: "version-resolver"
    semver-increment: "patch"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

# Descriptive labels only. These no longer carry the version bump — they exist so
# pull requests are filterable in the UI — so a wrong one costs a mislabelled row,
# not a wrong release number.
autolabeler:
  - label: "enhancement"
    title: '/^feat(\(.+\))?!?:/i'
  - label: "bug"
    title: '/^fix(\(.+\))?!?:/i'
  - label: "documentation"
    title: '/^docs(\(.+\))?!?:/i'
  - label: "chore"
    title: '/^(chore|ci|build|refactor|perf|test|style|revert)(\(.+\))?!?:/i'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
