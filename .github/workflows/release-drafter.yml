name: Release Drafter

on:
  push:
    branches: [main]
  # `pull_request` resolves to refs/pull/N/merge, an ephemeral merge commit, and
  # release-drafter forces dry-run on it — so the autolabeler computed labels and
  # then applied none. `pull_request_target` runs against the base ref with a
  # write token, which is what the autolabeler needs. It checks out no PR code,
  # and release-drafter executes none, so the usual pull_request_target caveat
  # does not apply here.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
