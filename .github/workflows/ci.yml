name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range promised by requires-python. The middle versions
        # share a grammar with 3.10, so ruff at target-version py310 covers them.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for hatch-vcs

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Each cell downloads ~2GB of CUDA-built torch; without this the matrix
          # spends more time fetching wheels than running tests.
          enable-cache: true

      - name: Install dependencies
        # The export extras are not optional for CI even though they are optional for
        # users: without them `tests/test_export.py` skips entirely and the ONNX and
        # OpenVINO paths ship untested. TensorRT is the one that cannot be here — it
        # needs an NVIDIA GPU, which these runners do not have.
        run: uv sync --dev --extra onnx --extra openvino --extra tracking

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest tests/ -v --tb=short --cov=modern_yolonas --cov-report=term-missing --cov-report=xml
